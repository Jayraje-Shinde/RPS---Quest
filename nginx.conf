# 01 + connection-handling tuning. Expect small gains over 01; the big win was keepalive.
worker_processes auto;
worker_rlimit_nofile 65535;
events {
  worker_connections 8192;
  multi_accept on;
}
http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  server_tokens off;
  keepalive_timeout 12s;
  keepalive_requests 10000;     # client-side connection reuse (autocannon keeps connections open)
proxy_cache_path /dev/shm/nginx_cache levels=1:2 keys_zone=micro:10m max_size=32m inactive=10s use_temp_path=off;

  upstream app_backend {
    server app:3000;            # native: server 127.0.0.1:3000;
    keepalive 256;              # per worker; must exceed concurrent upstream connections / workers
    keepalive_requests 10000;
    keepalive_timeout 60s;
  }
  server {
    listen 80 reuseport;        # one accept queue per worker, less accept contention
    access_log off;
    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
 proxy_cache micro;
      proxy_cache_methods GET;
      proxy_cache_key "$scheme$request_uri";
      proxy_cache_valid 200 10s;
      proxy_cache_lock on;
      proxy_cache_use_stale updating;
      add_header X-Cache-Status $upstream_cache_status always;
      proxy_pass http://app_backend;
    }
  }
}
